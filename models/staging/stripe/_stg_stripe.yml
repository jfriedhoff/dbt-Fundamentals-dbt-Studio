models:
  - name: stg_stripe__payments
    description: One row per payment
    columns:
      - name: payment_id
        description: PK
        data_tests:
          - unique
          - not_null
      - name: payment_status
        description: Payment outcome, either success or fail.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - success
                  - fail
      - name: order_id
        description: FK to orders
        data_tests:
          - relationships:
              arguments:
                field: order_id
                to: ref('stg_jaffle_shop__orders')
      - name: payment_method
        description: Payment method, e.g. credit_card or coupon.
      - name: payment_amount
        description: Payment amount in dollars.
      - name: created_at
        description: Date the payment was created.
