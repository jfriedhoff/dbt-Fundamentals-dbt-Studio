version: 2

sources:
  - name: stripe
    database: raw
    schema: stripe
    description: A clone of a PostgreSQL database in Snowflake
    tables:
      - name: payment
        description: Raw payment data
        columns:
           - name: id
             description: PK for payment
             data_tests:
               - not_null
               - unique
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: _batched_at
