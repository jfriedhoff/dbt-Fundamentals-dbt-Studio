models:
  - name: stg_jaffle_shop__customers
    description: One row per unique customer
    columns:
      - name: customer_id
        description: PK
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.

  - name: stg_jaffle_shop__orders
    description: One row per order
    columns:
      - name: order_id
        description: PK
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        description: FK to customers
        data_tests:
          - relationships:
              arguments:
                field: customer_id
                to: ref('stg_jaffle_shop__customers')
      - name: order_date
        description: Date the order was placed.
      - name: _etl_loaded_at
        description: Timestamp the row was loaded into Snowflake.
